<div class="login-page">
  <div class="login-wrapper">
    <div class="login-container">
      <h2 class="login-title">CENTRAL HUB</h2>
      <p class="login-subtitle">
        {{ isRegisterMode ? 'Crea una cuenta para comenzar' : 'Inicia sesión para continuar' }}
      </p>

      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>

      <form (submit)="onSubmit()" class="login-form">
        <!-- Campos para Registro -->
        <div *ngIf="isRegisterMode" class="form-group">
          <label for="nombres">Nombres *</label>
          <input
            type="text"
            id="nombres"
            name="nombres"
            [(ngModel)]="nombres"
            placeholder="Tus nombres"
            required
            [disabled]="isLoading"
          />
        </div>

        <div *ngIf="isRegisterMode" class="form-group">
          <label for="apellidos">Apellidos</label>
          <input
            type="text"
            id="apellidos"
            name="apellidos"
            [(ngModel)]="apellidos"
            placeholder="Tus apellidos"
            [disabled]="isLoading"
          />
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico *</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="ejemplo@correo.com"
            required
            autofocus
            [disabled]="isLoading"
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña *</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            required
            [disabled]="isLoading"
          />
        </div>

        <button
          type="submit"
          class="btn-primary"
          [class.loading]="isLoading"
          [disabled]="isLoading"
        >
          <span class="spinner"></span>
          <span class="btn-text">
            {{ isLoading ? (isRegisterMode ? 'Registrando...' : 'Ingresando...') : (isRegisterMode ? 'Registrarse' : 'Ingresar') }}
          </span>
        </button>
      </form>

      <!-- Alternar modo -->
      <div class="toggle-mode-container">
        <a href="javascript:void(0)" (click)="toggleMode()" class="toggle-mode-link">
          {{ isRegisterMode ? '¿Ya tienes una cuenta? Inicia sesión' : '¿No tienes una cuenta? Regístrate' }}
        </a>
      </div>
    </div>
  </div>
</div>
